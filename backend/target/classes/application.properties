spring.application.name=smart-blood-organ-donation-network

# Database settings
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_donation_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.springframework.web=INFO

# Session and authentication settings. The dev profile explicitly disables Secure for local HTTP.
server.servlet.session.timeout=${APP_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${APP_SESSION_COOKIE_SAME_SITE:Lax}
server.servlet.session.tracking-modes=cookie

# Mail settings
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
